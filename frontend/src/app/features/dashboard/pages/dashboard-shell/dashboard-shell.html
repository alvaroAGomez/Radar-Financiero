<!-- TopNavBar -->
<header class="fixed top-0 left-0 right-0 z-50 bg-surface-container-low border-b border-outline-variant/10">
  <nav class="flex justify-between items-center w-full max-w-7xl mx-auto px-6 md:px-8 py-4">
    <!-- Mobile left / Web left -->
    <div class="flex items-center gap-6">
      <h1 class="text-xl md:text-headline-sm font-headline font-extrabold text-primary tracking-tighter">
        Radar Financiero
      </h1>

      <!-- Only web: Status -->
      <div
        class="hidden md:flex items-center gap-2 text-on-surface-variant text-[10px] uppercase tracking-widest font-label bg-surface-container-low px-3 py-1 rounded-full border border-outline-variant/20">
        <span class="inline-block w-2 h-2 rounded-full bg-secondary animate-pulse-slow"></span>
        En vivo • <span>{{ currentTime() }}</span>
      </div>
    </div>

    <!-- Right Icons / Menu -->
    <div class="flex items-center gap-4 md:gap-6">
      <!-- Only web: Links -->
      <div class="hidden lg:flex gap-6">
        <a href="#" class="text-primary font-body text-xs font-semibold tracking-wide uppercase">Dashboard</a>
      </div>
    </div>
  </nav>
</header>

<!-- Main Grid -->
<main class="mt-20 px-4 md:px-8 pb-8 max-w-7xl mx-auto flex flex-col gap-6">

  <!-- SECCIÓN 1: MACRO RIBBON (100% del ancho de la pantalla) -->
  <div class="flex flex-col gap-4">
    <!-- FILA 1: Cotización del Dólar -->
    <section class="w-full">
      <app-dolar-panel></app-dolar-panel>
    </section>

    <!-- FILA 2: Tasas de Cauciones (ARS) Ribbon -->
    <section class="w-full">
      <app-cauciones-panel></app-cauciones-panel>
    </section>
  </div>

  <!-- SECCIÓN 2: GRILLA PRINCIPAL DE CONTENIDO (Layout estructurado por filas para alineación perfecta) -->
  <div class="flex flex-col gap-6">

    <!-- Fila 1: Crypto Assets (2/3) + Monitor Global de ETFs (1/3) -->
    <div class="grid grid-cols-1 lg:grid-cols-12 gap-6 items-stretch">
      <section class="lg:col-span-8 flex flex-col">
        <app-crypto-panel class="h-full flex flex-col"></app-crypto-panel>
      </section>
      <section class="lg:col-span-4 flex flex-col">
        <app-etf-panel class="h-full flex flex-col"></app-etf-panel>
      </section>
    </div>

    <!-- Fila 2: Mercado USA / CEDEARs (2/3) + Herramientas Pro (1/3) -->
    <div class="grid grid-cols-1 lg:grid-cols-12 gap-6 items-start">
      <section class="lg:col-span-8 flex flex-col">
        <app-cedears-panel></app-cedears-panel>
      </section>
      <section class="lg:col-span-4 flex flex-col">
        <app-herramientas-panel></app-herramientas-panel>
      </section>
    </div>

  </div>
</main>

<!-- Footer (Web Only) -->
